<body data-page="home">
  <svg class="doodle" aria-hidden="true" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="wp-sky" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" class="wp-sky-top" />
        <stop offset="100%" class="wp-sky-bottom" />
      </linearGradient>
    </defs>

    <rect width="1440" height="900" fill="url(#wp-sky)" />
    <circle class="wp-sun" cx="1110" cy="215" r="84" />
    <path class="wp-mt-far"
      d="M0 570 C 170 470, 310 495, 490 420 C 660 350, 810 445, 1020 390 C 1190 345, 1320 400, 1440 365 L 1440 900 L 0 900 Z" />
    <path class="wp-mt-mid"
      d="M0 640 C 210 545, 390 610, 620 520 C 830 438, 1040 535, 1260 470 C 1345 445, 1400 465, 1440 480 L 1440 900 L 0 900 Z" />
    <path class="wp-mt-near"
      d="M0 735 C 240 655, 470 725, 760 650 C 1010 585, 1220 645, 1440 605 L 1440 900 L 0 900 Z" />
  </svg>
  <main class="home home-container" id="desktop-home">
    <button type="button" class="tutorial-replay-btn" id="tutorial-replay-btn" aria-label="Putar ulang tutorial" title="Putar ulang tutorial">
      <span class="material-symbols-rounded notranslate" translate="no" aria-hidden="true">help</span>
    </button>
    <section class="clock-widget" id="clock-widget" aria-label="Jam Indonesia">
      <div class="clock-eyebrow">My time right now:</div>
      <div class="clock-time" id="clock-time">00:00</div>
      <div class="clock-date" id="clock-date" title="Klik untuk ganti WIB / WITA / WIT">-</div>
    </section>
    <div class="desktop-shortcuts" id="desktop-shortcuts" aria-label="Pintasan Aplikasi"></div>
  </main>

  <nav class="dock" id="dock" aria-label="Apps Dock"></nav>

  <div class="folder-scrim" id="folder-scrim" hidden></div>
  <aside class="folder-modal" id="folder-modal" role="dialog" aria-modal="true" aria-labelledby="folder-modal-title"
    hidden>
    <div class="folder-modal-header">
      <h2 class="folder-modal-title" id="folder-modal-title">More Apps</h2>
      <button type="button" class="folder-modal-close" id="folder-close-btn" aria-label="Close folder">
        <span class="material-symbols-rounded notranslate" translate="no" aria-hidden="true">close</span>
      </button>
    </div>
    <div class="folder-modal-surface" id="folder-modal-surface">
      <div class="folder-modal-bg" id="folder-modal-bg" aria-hidden="true"></div>
      <div class="folder-modal-grid" id="folder-modal-grid"></div>
    </div>
  </aside>

  <!-- Container for dynamically spawned multi-windows (No background scrim) -->
  <div class="windows-container" id="windows-container"></div>

  <script src="assets/icons-data.js?v=9"></script>
  <script src="core/i18n.js?v=5" defer></script>

  <script src="core/window-manager.js?v=24" defer></script>
  <script src="core/dock.js?v=30" defer></script>
  <script src="core/desktop.js?v=24" defer></script>
  <script src="core/tutorial.js?v=4" defer></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) { r.unregister(); });
      }).catch(function () {});
    }
  </script>
