<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Syne:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=block">
  <link rel="stylesheet" href="../../styles/tokens.css">
  <link rel="stylesheet" href="../../styles/app-ui.css">
  <link rel="stylesheet" href="../../styles/custom/projects.css?v=4">
  <script src="../../core/i18n.js?v=6" defer></script>
</head>
<body>
  <main class="app-shell">
    <section class="app-stack">
      <div class="app-card app-stack-fill">
        <div class="app-card-body projects-list" aria-label="Daftar Proyek OpenFishTools">
          <article class="project-item">
            <img class="project-icon" src="../../assets/icons/projects/studio.svg?v=2" width="46" height="46" alt="FishTools Studio">
            <div class="project-info">
              <div class="project-title-row">
                <span class="project-name">FishTools Studio</span>
                <span class="project-repo-pill">Studio</span>
              </div>
            </div>
            <a class="app-btn app-btn-primary project-visit-btn" href="https://github.com/openfishtools/Studio" target="_blank" rel="noopener noreferrer">
              <span>Visit</span>
              <span class="material-symbols-rounded notranslate" translate="no" aria-hidden="true">arrow_outward</span>
            </a>
          </article>

          <article class="project-item">
            <img class="project-icon" src="../../assets/icons/projects/cep.svg?v=2" width="46" height="46" alt="FishTools">
            <div class="project-info">
              <div class="project-title-row">
                <span class="project-name">FishTools</span>
                <span class="project-repo-pill">CEP</span>
              </div>
            </div>
            <a class="app-btn app-btn-primary project-visit-btn" href="https://github.com/openfishtools/CEP" target="_blank" rel="noopener noreferrer">
              <span>Visit</span>
              <span class="material-symbols-rounded notranslate" translate="no" aria-hidden="true">arrow_outward</span>
            </a>
          </article>

          <article class="project-item">
            <img class="project-icon" src="../../assets/icons/projects/web-tools.svg?v=2" width="46" height="46" alt="Web Tools">
            <div class="project-info">
              <div class="project-title-row">
                <span class="project-name">Web Tools</span>
                <span class="project-repo-pill">web-tools</span>
              </div>
            </div>
            <a class="app-btn app-btn-primary project-visit-btn" href="https://github.com/openfishtools/web-tools" target="_blank" rel="noopener noreferrer">
              <span>Visit</span>
              <span class="material-symbols-rounded notranslate" translate="no" aria-hidden="true">arrow_outward</span>
            </a>
          </article>

          <article class="project-item">
            <img class="project-icon" src="../../assets/icons/projects/web.svg?v=2" width="46" height="46" alt="Website">
            <div class="project-info">
              <div class="project-title-row">
                <span class="project-name">Website</span>
                <span class="project-repo-pill">web</span>
              </div>
            </div>
            <a class="app-btn app-btn-primary project-visit-btn" href="https://github.com/openfishtools/web" target="_blank" rel="noopener noreferrer">
              <span>Visit</span>
              <span class="material-symbols-rounded notranslate" translate="no" aria-hidden="true">arrow_outward</span>
            </a>
          </article>

          <article class="project-item">
            <img class="project-icon" src="../../assets/icons/projects/studio.svg?v=2" width="46" height="46" alt="FishTools Standalone">
            <div class="project-info">
              <div class="project-title-row">
                <span class="project-name">FishTools Standalone</span>
                <span class="project-repo-pill">Standalone</span>
              </div>
            </div>
            <a class="app-btn app-btn-primary project-visit-btn" href="https://github.com/openfishtools/Standalone" target="_blank" rel="noopener noreferrer">
              <span>Visit</span>
              <span class="material-symbols-rounded notranslate" translate="no" aria-hidden="true">arrow_outward</span>
            </a>
          </article>

          <article class="project-item">
            <img class="project-icon" src="../../assets/icons/projects/openfishtools.svg?v=2" width="46" height="46" alt="OpenFishTools">
            <div class="project-info">
              <div class="project-title-row">
                <span class="project-name">OpenFishTools</span>
                <span class="project-repo-pill">GitHub Org</span>
              </div>
            </div>
            <a class="app-btn app-btn-primary project-visit-btn" href="https://github.com/openfishtools" target="_blank" rel="noopener noreferrer">
              <span>Visit</span>
              <span class="material-symbols-rounded notranslate" translate="no" aria-hidden="true">arrow_outward</span>
            </a>
          </article>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
