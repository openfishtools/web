<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sequence to Vid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Syne:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=block">
  <link rel="stylesheet" href="../../styles/tokens.css">
  <link rel="stylesheet" href="../../styles/app-ui.css">
  <script src="../../core/app-utils.js" defer></script>
  <script src="../../core/ffmpeg-client.js" defer></script>
  <script src="../../core/i18n.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <div class="app-dropzone" id="dropzone" role="button" tabindex="0" aria-label="Pilih atau seret arsip ZIP image sequence">
      <span class="material-symbols-rounded app-dropzone-icon notranslate" aria-hidden="true" translate="no">burst_mode</span>
      <p class="app-dropzone-text">Pilih atau seret arsip ZIP frame</p>
      <p class="app-dropzone-hint">Mendukung PNG, JPG, WebP, BMP di dalam .zip</p>
      <input type="file" id="file-input" accept=".zip,application/zip" hidden>
    </div>

    <section class="app-stack is-hidden" id="workspace">
      <div class="app-file-meta">
        <div class="app-file-info">
          <span class="material-symbols-rounded notranslate" aria-hidden="true" translate="no">folder_zip</span>
          <div class="app-file-text">
            <div class="app-file-name" id="file-name">-</div>
            <div class="app-file-size" id="file-details">-</div>
          </div>
        </div>
        <button type="button" class="app-chip app-chip-compact" id="btn-change-file">Ganti</button>
      </div>

      <div class="app-card app-stack-fill">
        <div class="app-card-body">
          <div class="app-grid-2">
            <div class="app-field">
              <label class="app-label" for="fps-input">Frame Rate</label>
              <div class="app-input-wrap">
                <input type="number" id="fps-input" class="app-input app-input-has-unit" value="30" min="1" max="240">
                <span class="app-input-unit">FPS</span>
              </div>
            </div>
            <div class="app-field">
              <label class="app-label" for="bitrate-input">Bitrate</label>
              <div class="app-input-wrap">
                <input type="number" id="bitrate-input" class="app-input app-input-has-unit" value="12" min="1" max="50">
                <span class="app-input-unit">Mbps</span>
              </div>
            </div>
          </div>

          <div class="app-field">
            <span class="app-label">Audio (Opsional)</span>
            <div class="app-attach-bar" id="audio-bar" role="button" tabindex="0">
              <div class="app-file-info">
                <span class="material-symbols-rounded notranslate" aria-hidden="true" translate="no">music_note</span>
                <div class="app-file-text">
                  <div class="app-file-name" id="audio-name">Tambahkan audio / soundtrack</div>
                  <div class="app-file-size" id="audio-hint">MP3, WAV, M4A, AAC, MP4</div>
                </div>
              </div>
              <button type="button" class="app-icon-btn is-hidden" id="btn-remove-audio" aria-label="Hapus audio">
                <span class="material-symbols-rounded notranslate" aria-hidden="true" translate="no">close</span>
              </button>
              <input type="file" id="audio-input" accept="audio/*,video/*" hidden>
            </div>
          </div>

          <div class="app-progress is-hidden" id="progress-box">
            <div class="app-progress-header">
              <span id="progress-status">Memproses...</span>
              <span id="progress-percent">0%</span>
            </div>
            <div class="app-progress-track">
              <div class="app-progress-fill" id="progress-fill"></div>
            </div>
          </div>

          <div class="app-stats-grid is-hidden" id="stats-grid">
            <div class="app-stat-box">
              <span class="app-stat-label">Frame</span>
              <span class="app-stat-value" id="stat-frames">-</span>
            </div>
            <div class="app-stat-box">
              <span class="app-stat-label">FPS</span>
              <span class="app-stat-value app-stat-highlight" id="stat-fps">-</span>
            </div>
            <div class="app-stat-box">
              <span class="app-stat-label">Ukuran</span>
              <span class="app-stat-value app-stat-highlight" id="stat-size">-</span>
            </div>
          </div>

          <div class="app-logs app-logs-responsive" id="logs-box" aria-live="polite">
            <div class="app-logs-header">
              <span>Logs</span>
              <span class="app-logs-badge" id="logs-badge">Ready</span>
            </div>
            <div class="app-logs-body" id="logs-output"></div>
          </div>
        </div>

        <div class="app-card-footer">
          <button type="button" class="app-btn app-btn-primary" id="btn-start">
            <span class="material-symbols-rounded notranslate" aria-hidden="true" translate="no">movie_creation</span>
            Konversi ke Video
          </button>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
