<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Preset</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Syne:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
  <link rel="stylesheet" href="../../styles/tokens.css">
  <link rel="stylesheet" href="../../styles/app-ui.css">
  <link rel="stylesheet" href="../../styles/custom/preset.css?v=4">
  <script src="../../core/app-utils.js" defer></script>
  <script src="../../core/i18n.js" defer></script>
</head>
<body>
  <main class="app-shell preset-shell">
    <div class="preset-toolbar">
      <div class="app-input-wrap preset-search">
        <input type="search" id="search-input" class="app-input" placeholder="Cari preset, plugin, versi..." autocomplete="off">
      </div>
      <div class="m3-segmented preset-segmented" id="sw-filter" role="radiogroup" aria-label="Filter Software">
        <button type="button" class="m3-segment is-active" data-sw="all" role="radio" aria-checked="true">Semua</button>
        <button type="button" class="m3-segment" data-sw="OFTS" role="radio" aria-checked="false">OFTS</button>
        <button type="button" class="m3-segment" data-sw="AE" role="radio" aria-checked="false">AE</button>
        <button type="button" class="m3-segment" data-sw="AM" role="radio" aria-checked="false">AM</button>
      </div>
    </div>

    <div class="app-notice is-hidden" id="loading-box">
      <span class="m3-spinner" aria-hidden="true"></span>
      <span>Memuat galeri preset...</span>
    </div>

    <div class="app-notice app-notice-error is-hidden" id="error-banner" role="alert">
      <span class="material-symbols-rounded" aria-hidden="true">error</span>
      <span id="error-text">-</span>
    </div>

    <section class="preset-scroll" id="preset-scroll">
      <div class="preset-video-grid" id="preset-grid"></div>
    </section>

    <div class="preset-sheet-backdrop is-hidden" id="variant-backdrop" role="dialog" aria-modal="true" aria-labelledby="variant-title">
      <div class="preset-sheet-panel" id="variant-panel">
        <div class="preset-sheet-grabber" aria-hidden="true"></div>
        <div class="preset-sheet-head">
          <div class="preset-sheet-heading">
            <span class="preset-deprecated-pill">Deprecated UI</span>
            <h3 class="preset-sheet-title" id="variant-title">-</h3>
            <p class="preset-sheet-sub" id="variant-sub">-</p>
          </div>
          <button type="button" class="preset-sheet-close" id="variant-close" aria-label="Tutup">
            <span class="material-symbols-rounded" aria-hidden="true">close</span>
          </button>
        </div>
        <p class="preset-deprecated-note">UI pemilihan varian ini sudah deprecated dan tidak akan digunakan lagi ke depannya.</p>
        <div class="preset-variant-list" id="variant-list"></div>
      </div>
    </div>
  </main>

  <script src="app.js?v=7" defer></script>
</body>
</html>
