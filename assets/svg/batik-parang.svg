<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" fill="none">
  <!-- Diagonal 45-degree Batik Parang Wave & Mlinjon -->
  <g stroke="currentColor" stroke-width="1.3" opacity="0.9">
    <!-- Main Diagonal Flow 1 -->
    <path d="M-20,30 C0,10 20,40 40,20 C60,0 80,30 100,10 C120,-10 140,20 160,0" stroke-linecap="round"/>
    <path d="M-20,45 C0,25 20,55 40,35 C60,15 80,45 100,25 C120,5 140,35 160,15" stroke-linecap="round"/>
    
    <!-- Main Diagonal Flow 2 -->
    <path d="M-20,80 C0,60 20,90 40,70 C60,50 80,80 100,60 C120,40 140,70 160,50" stroke-linecap="round"/>
    <path d="M-20,95 C0,75 20,105 40,85 C60,65 80,95 100,75 C120,55 140,85 160,65" stroke-linecap="round"/>

    <!-- Parang Blade Curves (Lidah Parang) -->
    <!-- Row 1 -->
    <path d="M20,25 C25,20 30,22 35,18 C32,26 26,30 20,25 Z" fill="currentColor" opacity="0.4"/>
    <path d="M70,25 C75,20 80,22 85,18 C82,26 76,30 70,25 Z" fill="currentColor" opacity="0.4"/>
    <path d="M20,75 C25,70 30,72 35,68 C32,76 26,80 20,75 Z" fill="currentColor" opacity="0.4"/>
    <path d="M70,75 C75,70 80,72 85,68 C82,76 76,80 70,75 Z" fill="currentColor" opacity="0.4"/>

    <!-- Mlinjon / Melinjo Diamond Rows (Garis Ketupat Isen) -->
    <!-- Row 1 Diamonds -->
    <polygon points="10,48 14,44 18,48 14,52" fill="currentColor"/>
    <polygon points="35,48 39,44 43,48 39,52" fill="currentColor"/>
    <polygon points="60,48 64,44 68,48 64,52" fill="currentColor"/>
    <polygon points="85,48 89,44 93,48 89,52" fill="currentColor"/>

    <!-- Row 2 Diamonds -->
    <polygon points="10,98 14,94 18,98 14,102" fill="currentColor"/>
    <polygon points="35,98 39,94 43,98 39,102" fill="currentColor"/>
    <polygon points="60,98 64,94 68,98 64,102" fill="currentColor"/>
    <polygon points="85,98 89,94 93,98 89,102" fill="currentColor"/>

    <!-- Row 0 Diamonds -->
    <polygon points="10,-2 14,-6 18,-2 14,2" fill="currentColor"/>
    <polygon points="35,-2 39,-6 43,-2 39,2" fill="currentColor"/>
    <polygon points="60,-2 64,-6 68,-2 64,2" fill="currentColor"/>
    <polygon points="85,-2 89,-6 93,-2 89,2" fill="currentColor"/>
  </g>
</svg>
