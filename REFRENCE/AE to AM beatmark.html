<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AE to AM XML Converter</title>
    <style>
        :root {
            --mt-bg: #10140E;
            --mt-surface: #161C12;
            --mt-surface-1: #1D2417;
            --mt-surface-2: #26301D;
            --mt-outline: #3A4530;
            --mt-primary: #A8D08D;
            --mt-primary-dim: #7FA868;
            --mt-on-primary: #16260C;
            --mt-on-surface: #E4EBDA;
            --mt-on-surface-dim: #B6C0A8;
            --mt-tertiary: #8FBFAE;
            --mt-error: #E24C4C;
        }

        * {
            box-sizing: border-box;
            font-family: "Segoe UI", system-ui, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--mt-bg);
            color: var(--mt-on-surface);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--mt-surface);
            border: 1px solid var(--mt-outline);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            margin: 0 0 8px 0;
            text-align: center;
            color: var(--mt-primary);
        }

        p.subtitle {
            font-size: 13px;
            color: var(--mt-on-surface-dim);
            text-align: center;
            margin: 0 0 24px 0;
        }

        .upload-zone {
            border: 2px dashed var(--mt-outline);
            border-radius: 16px;
            padding: 40px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s;
            background: var(--mt-surface-1);
        }

        .upload-zone.dragover {
            border-color: var(--mt-primary);
            background: var(--mt-surface-2);
        }

        .upload-icon {
            color: var(--mt-primary);
            margin-bottom: 12px;
        }

        .config-section {
            margin-top: 24px;
            display: none;
            background: var(--mt-surface-1);
            border: 1px solid var(--mt-outline);
            border-radius: 16px;
            padding: 20px;
        }

        .config-title {
            font-size: 15px;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 16px;
            color: var(--mt-primary);
            border-bottom: 1px solid var(--mt-outline);
            padding-bottom: 8px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group-full { grid-column: span 2; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }

        label {
            font-size: 12px;
            font-weight: 600;
            color: var(--mt-on-surface-dim);
        }

        input, select {
            background-color: var(--mt-surface-2);
            border: 1px solid var(--mt-outline);
            border-radius: 8px;
            color: var(--mt-on-surface);
            padding: 10px 12px;
            font-size: 14px;
            outline: none;
            width: 100%;
        }

        input:focus, select:focus { border-color: var(--mt-primary); }

        .beat-summary {
            margin-top: 16px;
            font-size: 13px;
            color: var(--mt-tertiary);
            font-weight: 500;
            background: var(--mt-surface-2);
            padding: 10px;
            border-radius: 8px;
        }

        .btn-convert {
            display: block;
            width: 100%;
            background-color: var(--mt-primary);
            color: var(--mt-on-primary);
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.2s;
        }

        .btn-convert:hover { background-color: var(--mt-primary-dim); }
        .btn-convert:active { transform: scale(0.98); }

        .status-msg {
            margin-top: 12px;
            font-size: 13px;
            text-align: center;
            font-weight: 500;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Konverter AE ke AM</h1>
        <p class="subtitle">Ekstrak Komposisi & Beatmark dari AE (.aepx) ke format Alight Motion (.xml)</p>

        <div class="upload-zone" id="uploadZone">
            <svg class="upload-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M12 17V3M12 3L7 8M12 3l5 5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M20 17v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <div style="font-size: 14px; font-weight: 500; margin-bottom: 4px;">Pilih atau jatuhkan file AE XML</div>
            <div style="font-size: 12px; color: var(--mt-on-surface-dim);">Mendukung file .xml / .aepx</div>
            <input type="file" id="fileInput" accept=".xml,.aepx" style="display: none;">
        </div>

        <div class="config-section" id="configSection">
            <div class="config-title">Pengaturan Proyek Alight Motion</div>
            <div class="form-grid">
                <div class="form-group form-group-full">
                    <label>Pilih Komposisi (Composition)</label>
                    <select id="compSelect"></select>
                </div>
                <div class="form-group form-group-full">
                    <label>Judul Proyek</label>
                    <input type="text" id="compTitle" placeholder="Nama Proyek">
                </div>
                <div class="form-group">
                    <label>Resolusi Lebar (Width)</label>
                    <input type="number" id="compWidth" value="1080">
                </div>
                <div class="form-group">
                    <label>Resolusi Tinggi (Height)</label>
                    <input type="number" id="compHeight" value="1920">
                </div>
                <div class="form-group">
                    <label>Frame Rate (FPS)</label>
                    <input type="number" id="compFps" value="30">
                </div>
                <div class="form-group">
                    <label>Total Durasi (ms)</label>
                    <input type="number" id="compDuration" value="5000">
                </div>
            </div>
            <div class="beat-summary" id="beatSummary"></div>
            <button class="btn-convert" id="btnConvert">Konversi & Unduh XML</button>
        </div>

        <div class="status-msg" id="statusMsg"></div>
    </div>

    <script>
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const configSection = document.getElementById('configSection');
        const compSelect = document.getElementById('compSelect');
        const compTitle = document.getElementById('compTitle');
        const compWidth = document.getElementById('compWidth');
        const compHeight = document.getElementById('compHeight');
        const compFps = document.getElementById('compFps');
        const compDuration = document.getElementById('compDuration');
        const beatSummary = document.getElementById('beatSummary');
        const btnConvert = document.getElementById('btnConvert');
        const statusMsg = document.getElementById('statusMsg');

        let foundCompositions = [];
        let parsedBeats = [];

        // Upload Handlers
        uploadZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => e.target.files.length && handleFile(e.target.files[0]));
        uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('dragover'); });
        ['dragleave', 'dragend'].forEach(t => uploadZone.addEventListener(t, () => uploadZone.classList.remove('dragover')));
        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            e.dataTransfer.files.length && handleFile(e.dataTransfer.files[0]);
        });

        compSelect.addEventListener('change', (e) => selectComposition(parseInt(e.target.value)));

        function handleFile(file) {
            statusMsg.style.color = 'var(--mt-primary)';
            statusMsg.textContent = 'Menganalisa berkas AE...';

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(e.target.result, 'text/xml');
                    if (!xmlDoc.querySelector('AfterEffectsProject')) throw new Error('Berkas tidak dikenali sebagai After Effects XML.');

                    foundCompositions = [];
                    const items = xmlDoc.querySelectorAll('Fold > Item');
                    
                    items.forEach((item, index) => {
                        const nameNode = item.querySelector('string');
                        const hasLayers = item.querySelector('SLay') || item.querySelector('CLay');
                        
                        if (nameNode && hasLayers) {
                            foundCompositions.push({
                                id: index,
                                name: nameNode.textContent,
                                element: item
                            });
                        }
                    });

                    if (foundCompositions.length === 0) throw new Error('Tidak ditemukan Komposisi dalam berkas ini.');

                    compSelect.innerHTML = '';
                    foundCompositions.forEach(comp => {
                        const opt = document.createElement('option');
                        opt.value = comp.id;
                        opt.textContent = comp.name;
                        compSelect.appendChild(opt);
                    });

                    selectComposition(foundCompositions[0].id);
                    statusMsg.textContent = '';
                    configSection.style.display = 'block';
                } catch (err) {
                    statusMsg.style.color = 'var(--mt-error)';
                    statusMsg.textContent = 'Gagal: ' + err.message;
                    configSection.style.display = 'none';
                }
            };
            reader.readAsText(file);
        }

        function selectComposition(index) {
            const comp = foundCompositions.find(c => c.id === index);
            if (!comp) return;

            // 1. Ekstrak Pengaturan Komposisi (Timebase & FPS) secara presisi dari biner CDTA
            let timebase = 30720; // Default fallback AE Timebase
            let detectedFps = 30;

            const cdtaNode = comp.element.querySelector('cdta');
            if (cdtaNode) {
                const bdata = cdtaNode.getAttribute('bdata');
                if (bdata && bdata.length >= 24) {
                    // Karakter 8-15 (Byte 4-7) = Durasi per Frame (dalam ticks)
                    const frameDurationTicks = parseInt(bdata.substring(8, 16), 16);
                    // Karakter 16-23 (Byte 8-11) = Timebase (Ticks per second)
                    const extractedTimebase = parseInt(bdata.substring(16, 24), 16);
                    
                    if (frameDurationTicks > 0 && extractedTimebase > 0) {
                        timebase = extractedTimebase;
                        detectedFps = Math.round(timebase / frameDurationTicks);
                    }
                }
            }

            // 2. Ekstrak Beatmark
            parsedBeats = [];
            const ldatNodes = comp.element.querySelectorAll('mrst list ldat');
            
            ldatNodes.forEach(ldat => {
                const bdata = ldat.getAttribute('bdata');
                if (bdata) {
                    for (let i = 0; i < bdata.length; i += 32) {
                        if (i + 32 > bdata.length) break;
                        const chunk = bdata.substring(i, i + 32);
                        const hexTime = chunk.substring(0, 8); // Ticks time
                        const val = parseInt(hexTime, 16);
                        if (!isNaN(val)) {
                            // Hitung waktu ms berdasarkan Timebase akurat
                            const ms = Math.round((val / timebase) * 1000);
                            if (!parsedBeats.includes(ms)) parsedBeats.push(ms);
                        }
                    }
                }
            });

            parsedBeats.sort((a, b) => a - b);
            
            compTitle.value = comp.name;
            compFps.value = detectedFps;

            if (parsedBeats.length > 0) {
                const lastBeat = parsedBeats[parsedBeats.length - 1];
                // Durasi menyesuaikan beat terakhir (ditambah 1 frame agar tidak terlalu mepet)
                const frameDurationMs = Math.ceil(1000 / detectedFps);
                compDuration.value = lastBeat + frameDurationMs;
                
                beatSummary.innerHTML = `
                    <span style="color:var(--mt-primary)">✓ Berhasil memuat ${parsedBeats.length} Beatmark.</span><br>
                    <span style="font-size:11px; opacity:0.8; margin-top:4px; display:inline-block;">
                        (Auto-Detect: ${detectedFps} FPS | Timebase: ${timebase} ticks)
                    </span>
                `;
            } else {
                compDuration.value = 5000;
                beatSummary.innerHTML = `⚠️ Tidak ada Beatmark yang terdeteksi di komposisi ini.`;
            }
        }

        btnConvert.addEventListener('click', () => {
            const title = compTitle.value.trim() || 'Project XML';
            const w = parseInt(compWidth.value) || 1080;
            const h = parseInt(compHeight.value) || 1920;
            const fps = parseInt(compFps.value) || 30;
            const duration = parseInt(compDuration.value) || 5000;

            if (parsedBeats.length === 0) {
                alert('Komposisi terpilih tidak memiliki data penanda untuk dikonversi.');
                return;
            }

            let xmlStr = `<?xml version='1.0' encoding='UTF-8' ?>\n`;
            xmlStr += `<scene title="${escapeXml(title)}" width="${w}" height="${h}" exportWidth="${w}" exportHeight="${h}" precompose="dynamicResolution" bgcolor="#ff000000" totalTime="${duration}" fps="${fps}" modifiedTime="${Date.now()}" amver="1028425" ffver="106" am="com.alightcreative.motion/5.0.273.1028425" amplatform="android" retime="freeze" retimeAdaptFPS="false">\n`;
            
            parsedBeats.forEach(ms => {
                xmlStr += `  <bookmark t="${ms}" />\n`;
            });

            // Injeksi Shape Placeholder untuk menjaga durasi
            const centerX = (w / 2).toFixed(6);
            const centerY = (h / 2).toFixed(6);
            const randomId = Math.floor(Math.random() * 900000000) + 100000000;

            xmlStr += `  <shape id="${randomId}" label="placeholder" startTime="0" endTime="${duration}" fillType="color" mediaFillMode="fill" s=".rect">\n`;
            xmlStr += `    <transform>\n`;
            xmlStr += `      <location value="${centerX},${centerY},0.000000" />\n`;
            xmlStr += `      <scale value="5.400000,5.400000" />\n`;
            xmlStr += `    </transform>\n`;
            xmlStr += `    <fillColor value="#ff5f3a8e" />\n`;
            xmlStr += `    <property name="size" type="vec2" value="100.000000,100.000000" />\n`;
            xmlStr += `  </shape>\n`;

            xmlStr += `</scene>`;

            const blob = new Blob([xmlStr], { type: 'text/xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${title.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.xml`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            statusMsg.style.color = 'var(--mt-primary)';
            statusMsg.textContent = 'Konversi berhasil! File XML Alight Motion telah diunduh.';
        });

        function escapeXml(str) {
            return str.replace(/[<>&'"]/g, c => {
                switch(c) {
                    case '<': return '&lt;';
                    case '>': return '&gt;';
                    case '&': return '&amp;';
                    case '\'': return '&apos;';
                    case '"': return '&quot;';
                }
            });
        }
    </script>
</body>

</html>
